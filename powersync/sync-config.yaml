# Sync Streams (edition 3). Read-only replication to the iPhone, filtered by the JWT subject.
# Columns are explicit: the client schema (03_iOS/02_Local_Data_Sync.md) must list the same ones.
# Never synced: user_id, command receipts, auth tables, tombstones (03_Data_Model.md §11).
config:
  edition: 3
  timestamp_max_precision: milliseconds

streams:
  planner:
    auto_subscribe: true
    queries:
      - >-
        SELECT id, name, color_key, sort_order, archived_at, deleted_at, deleted_by_command_id, revision, created_at, updated_at
        FROM projects WHERE user_id = auth.user_id()
      - >-
        SELECT id, project_id, title, notes, priority, status, completed_at,
               scheduled_date, scheduled_time, scheduled_time_zone, scheduled_start_at, duration_minutes,
               deadline_date, deadline_time, deadline_time_zone, deadline_at,
               recurrence, subtasks, missed_ignored_before, search_text, deleted_at, deleted_by_command_id, revision, created_at, updated_at
        FROM tasks WHERE user_id = auth.user_id()
      - >-
        SELECT id, name, normalized_name, revision, deleted_at, created_at, updated_at
        FROM tags WHERE user_id = auth.user_id()
      - >-
        SELECT id, task_id, tag_id, deleted_at, created_at, updated_at
        FROM task_tags WHERE user_id = auth.user_id()
      - >-
        SELECT id, auto_tags, revision, created_at, updated_at
        FROM user_settings WHERE id = auth.user_id()
      - >-
        SELECT id, task_id, occurrence_key, status, completed_at,
               override_date, override_time, override_time_zone, successor_occurrence_key, created_at, updated_at
        FROM task_occurrences WHERE user_id = auth.user_id()
      # A removed reminder leaves the bucket, so the client deletes its row.
      - >-
        SELECT id, task_id, occurrence_key, kind, offset_minutes, local_time,
               absolute_date, absolute_time, absolute_time_zone, state, created_at, updated_at
        FROM reminders WHERE user_id = auth.user_id() AND deleted_at IS NULL

  # Assistant history, read-only on the phone (03_Data_Model.md §7, §11). Never synced: request hashes,
  # calendar snapshots, token counts, stored plans (only their hash and preview), Undo request records.
  assistant:
    auto_subscribe: true
    queries:
      - SELECT id, title, created_at, updated_at FROM conversations WHERE user_id = auth.user_id()
      - >-
        SELECT id, conversation_id, seq, role, kind, text, original_transcript, transcription_id, turn_id,
               revises_message_id, created_at
        FROM messages WHERE user_id = auth.user_id()
      - >-
        SELECT id, conversation_id, user_message_id, status, risk_class, reply_message_id, error_code, created_at, finished_at
        FROM assistant_turns WHERE user_id = auth.user_id()
      - >-
        SELECT id, turn_id, plan_hash, preview, state, expires_at, decided_at, created_at
        FROM assistant_proposals WHERE user_id = auth.user_id()
      - >-
        SELECT id, group_id, plan_index, turn_id, proposal_id, aggregate_type, aggregate_id, command_type, changes,
               resulting_revision, undo_state, undo_expires_at, undo_of_action_id, created_at
        FROM ai_actions WHERE user_id = auth.user_id()

  # The database lifetime marker (restore detection, 04_Backend/05_Homelab_Deployment.md).
  server_meta:
    auto_subscribe: true
    query: SELECT generation AS id, generation FROM server_meta
